[build]
  command = "npm run build"
  publish = "out"

# Force the auto-generated Netlify subdomain to redirect to the custom
# domain, so it's not independently usable and doesn't duplicate-index
# the same content under two hostnames.
[[redirects]]
  from = "https://bhajananandmandali.netlify.app/*"
  to = "https://bhajananandmandali.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
